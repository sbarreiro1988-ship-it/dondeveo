name: Build Next.js

on:
  push:
    branches: [build-deploy]
    paths-ignore:
      - '.next/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Copy static assets into standalone (required by Next.js docs)
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      - name: Commit built .next/ to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .next/
          # Never commit the build cache — it can grow to several GB on the server
          git rm -r --cached --ignore-unmatch .next/cache/
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "build: auto-compile .next/ [skip ci]"
          git push origin build-deploy
